:root{
  --ground:#EEF4F9; --ink:#1E3247; --muted:#5B7186; --chip:#FFFFFF; --chip-line:#D3E2EE;
  --card:#FFFFFF; --navy:#0E3A66; --phone:#215E99; --mail:#0F8F7A;
  --blue:#1C8FCF; --sky:#39AAE1; --wave:#D7EEFA; --rule:#9FD3F0; --card-muted:#5B7186;
  --font:"Janna LT","Tajawal","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--ground:#0C1824;--ink:#E3EDF6;--muted:#93A9BD;--chip:#132433;--chip-line:#24394C;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;min-height:calc(100dvh - 48px);margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:22px}
.scene{width:100%}
.flip{all:unset;display:block;width:100%;cursor:pointer;border-radius:4.5%/7%}
.flip:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.inner{position:relative;width:100%;aspect-ratio:1.586;will-change:transform}
.face{position:absolute;inset:0;background:var(--card);border-radius:4.5%/7%;overflow:hidden;container-type:inline-size;
  box-shadow:0 1px 2px rgb(14 58 102/.08),0 12px 32px -8px rgb(14 58 102/.22);display:grid;grid-template-columns:41% 1px 1fr;align-items:center}
/* 2D flip: only one face is ever shown; the card squeezes to its edge, swaps face, and opens again (Safari mangles 3D flips) */
.back,.flipped .front{visibility:hidden}
.flipped .back{visibility:visible}
.brand{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqw;padding:4cqw 3cqw}
.brand svg.wave{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.brand>*:not(.wave){position:relative;z-index:1}
.brand img{width:31cqw;max-width:100%;display:block}
.qr{width:16cqw;aspect-ratio:1;background:#fff;padding:1.4cqw;border-radius:1.2cqw;box-shadow:0 0 0 .25cqw var(--wave)}
.qr svg{display:block;width:100%;height:100%}
.qr-cap{font-size:2.1cqw;color:var(--phone);margin-top:-2cqw;text-align:center}
.rule{width:1px;height:62%;background:linear-gradient(var(--card),var(--rule) 20%,var(--rule) 80%,var(--card))}
.info{padding:0 5.5cqw;display:grid;gap:.8cqw;min-width:0}
.name{margin:0;color:var(--navy);font-weight:700;font-size:6cqw;line-height:1.2}
.title{margin:0;color:var(--navy);font-weight:700;font-size:3.2cqw;line-height:1.45;text-wrap:balance}
.org{margin:0 0 2.2cqw;color:var(--card-muted);font-size:2.9cqw}
.line{display:flex;gap:1.6cqw;align-items:center;font-size:3cqw;line-height:1.5;min-width:0}
.line svg{width:3cqw;height:3cqw;flex:none}
.tel{color:var(--phone);font-weight:700;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.mail{color:var(--mail);text-decoration:underline;text-underline-offset:.5cqw;font-size:2.8cqw;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.web{color:var(--blue);font-size:2.8cqw;direction:ltr;unicode-bidi:isolate}
.back .name{font-size:5.4cqw}
.back .title{font-size:2.9cqw;text-wrap:wrap}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{font:inherit;font-size:1rem;font-weight:700;padding:11px 20px;border-radius:999px;border:1px solid var(--chip-line);background:var(--chip);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hint{margin:0;text-align:center;color:var(--muted);font-size:.9rem}
.ver{margin:0;text-align:center;color:var(--muted);font-size:.7rem;opacity:.5;font-variant-numeric:tabular-nums}
/* image export mode: #shot-ar / #shot-en */
.shot body{padding:0;background:transparent}
.shot .wrap{max-width:none;min-height:0;display:block}
.shot .actions,.shot .hint,.shot .ver{display:none}
.shot .face{box-shadow:none}
</style>

<script>
const root=document.documentElement,scene=document.getElementById('scene'),save=document.getElementById('save'),turn=document.getElementById('turn'),hint=document.getElementById('hint');
const inner=scene.querySelector('.inner'),still=matchMedia('(prefers-reduced-motion: reduce)');
let busy=false;
function apply(en){
  scene.classList.toggle('flipped',en);
  save.href=en?'Faisal-Alshammari-en.vcf':'Faisal-Alshammari-ar.vcf';
  save.textContent=en?'Save contact':'حفظ جهة الاتصال';
  turn.textContent=en?'العربية':'English';
  hint.textContent=en?'Tap the card to flip':'اضغط على البطاقة لقلبها';
  root.lang=en?'en':'ar';
}
function flip(){
  const en=!scene.classList.contains('flipped');
  if(still.matches||!inner.animate){apply(en);return;}
  if(busy)return;busy=true;
  inner.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:170,easing:'ease-in'}).onfinish=()=>{
    apply(en);
    inner.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:190,easing:'ease-out'}).onfinish=()=>{busy=false;};
  };
}
document.getElementById('flip').addEventListener('click',flip);
turn.addEventListener('click',flip);
const h=location.hash;
if(h.startsWith('#shot')){root.classList.add('shot');apply(h==='#shot-en');}
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
  // When a new version takes over, reload once so it shows straight away
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded&&navigator.serviceWorker.controller){reloaded=true;location.reload();}});
}
</script>
